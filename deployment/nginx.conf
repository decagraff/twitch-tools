server {
    listen 80;
    server_name tu_dominio_o_ip;  # Cambiar por tu dominio o IP

    # Logs
    access_log /var/log/nginx/twitch-dev-hub-access.log;
    error_log /var/log/nginx/twitch-dev-hub-error.log;

    # Frontend - Servir archivos estáticos de React
    location / {
        root /var/www/html/twitch-developer-hub/client/dist;
        try_files $uri $uri/ /index.html;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Backend API - Proxy reverso a Node.js
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/html/twitch-developer-hub/client/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
